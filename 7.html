<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Maker Studio - Ultra Detailed</title>
    <style>
        /* === 1. Root Variables & Global Setup === */
        :root {
            --wall: #222b36;
            --floor: #161c24;
            --desk: #4a3b32;
            --neon: #00ffcc;
            --cnc: #2c3e50;
            --printer: #ecf0f1;
            --laser: #8e44ad;
            --glow: #ff3366;
            --wire: #111;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: #0b0f14;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
            color: #fff;
        }

        /* === 2. Room Environment & Depth === */
        .studio {
            position: relative;
            width: 1200px; height: 750px;
            background: radial-gradient(circle at 50% 30%, #3a4a5a 0%, var(--wall) 70%);
            border: 4px solid #333; border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 150px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Concrete Floor & Safety Tape */
        .floor {
            position: absolute; bottom: 0; width: 100%; height: 28%;
            background: linear-gradient(to bottom, #1e242b 0%, #0d1116 100%);
            border-top: 8px solid #0a0d11; z-index: 1;
        }
        .floor::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 100px);
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top; opacity: 0.5;
        }
        .safety-tape {
            position: absolute; bottom: 15%; left: 80px; width: 260px; height: 15px;
            background: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 15px, #111 15px, #111 30px);
            z-index: 2; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            transform: perspective(600px) rotateX(40deg);
        }

        /* Ambient Lighting */
        .ceiling-light {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(ellipse, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none; z-index: 20;
        }

        /* === 3. Background Details (Tools, Shelves, Deco) === */
        .ui-header {
            position: absolute; top: 20px; width: 100%; text-align: center; z-index: 20; pointer-events: none;
        }
        .ui-header h1 { margin: 0; font-size: 28px; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-transform: uppercase; letter-spacing: 2px; }
        .ui-header p { margin: 5px 0 0; color: #888; font-size: 14px; }

        /* Power Box & Cables */
        .power-box { position: absolute; top: 250px; left: 80px; width: 60px; height: 90px; background: #7f8c8d; border: 2px solid #222; border-radius: 4px; z-index: 2; }
        .power-box::before { content: '⚡'; position: absolute; top: 10px; left: 18px; color: #f1c40f; }
        .cable { position: absolute; background: transparent; border: 4px solid var(--wire); border-top: none; border-left: none; z-index: 1; }
        .cable-cnc { top: 340px; left: 110px; width: 60px; height: 150px; border-radius: 0 0 20px 0; }
        .cable-table { top: 200px; left: 550px; width: 300px; height: 200px; border-radius: 0 0 50px 0; border-top: 4px solid var(--wire); border-bottom: none; opacity: 0.6;}

        /* Pegboard */
        .pegboard {
            position: absolute; top: 120px; left: 350px; width: 500px; height: 220px;
            background: #5c3a21; border: 5px solid #3e2723; border-radius: 6px;
            background-image: radial-gradient(#2a1a11 2px, transparent 2px); background-size: 16px 16px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6); z-index: 2;
        }
        
        /* CSS Drawn Tools */
        .tool { position: absolute; background: #bdc3c7; box-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
        .wrench { top: 30px; left: 40px; width: 12px; height: 70px; border-radius: 6px; }
        .wrench::before { content: ''; position: absolute; top: -10px; left: -6px; width: 24px; height: 24px; border: 4px solid #bdc3c7; border-radius: 50%; border-top-color: transparent; }
        .hammer { top: 40px; left: 100px; width: 14px; height: 60px; background: #e67e22; border-radius: 2px; }
        .hammer::before { content: ''; position: absolute; top: -10px; left: -15px; width: 44px; height: 18px; background: #7f8c8d; border-radius: 4px; }
        .gear { top: 40px; right: 120px; width: 40px; height: 40px; background: transparent; border: 8px dashed #95a5a6; border-radius: 50%; }
        .gear::after { content: ''; position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; background: #5c3a21; border-radius: 50%; box-shadow: 0 0 0 6px #7f8c8d; }
        .saw { top: 140px; left: 50px; width: 120px; height: 30px; background: #bdc3c7; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
        .saw::before { content: ''; position: absolute; top: 0; left: 0; width: 30px; height: 40px; background: #d35400; border-radius: 5px 0 0 5px; }
        /* New Tools */
        .screwdriver { top: 30px; left: 180px; width: 6px; height: 40px; background: #bdc3c7; }
        .screwdriver::before { content: ''; position: absolute; top: 38px; left: -3px; width: 12px; height: 35px; background: #f1c40f; border-radius: 4px; border: 1px solid #333; }
        .pliers { top: 130px; right: 50px; width: 8px; height: 40px; background: #e74c3c; transform: rotate(15deg); border-radius: 5px; }
        .pliers::after { content: ''; position: absolute; top: 0; left: 15px; width: 8px; height: 40px; background: #e74c3c; border-radius: 5px; }
        .pliers::before { content: ''; position: absolute; top: -20px; left: 2px; width: 18px; height: 25px; border: 4px solid #bdc3c7; border-bottom: none; border-radius: 10px 10px 0 0; }

        /* Blueprint & Shelves */
        .blueprint { position: absolute; top: 100px; right: 80px; width: 180px; height: 130px; background: #2980b9; border: 2px solid #ecf0f1; transform: rotate(-3deg); box-shadow: 2px 5px 15px rgba(0,0,0,0.5); z-index: 2; }
        .blueprint::after { content: ''; position: absolute; inset: 10px; border: 2px dashed rgba(255,255,255,0.4); }
        .blueprint::before { content: 'ASSEMBLY \A DIAGRAM'; white-space: pre; position: absolute; top: 30px; left: 20px; font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; font-family: sans-serif; }
        .shelf { position: absolute; top: 280px; right: 60px; width: 220px; height: 12px; background: #4a3b32; box-shadow: 0 10px 20px rgba(0,0,0,0.6); z-index: 2; border-radius: 2px; }
        .box1 { position: absolute; bottom: 12px; left: 20px; width: 50px; height: 40px; background: #d35400; border: 2px solid #a04000; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .box2 { position: absolute; bottom: 12px; right: 40px; width: 70px; height: 30px; background: #7f8c8d; border: 2px solid #555; }
        .box3 { position: absolute; bottom: 12px; left: 80px; width: 40px; height: 20px; background: #27ae60; border: 2px solid #145a32; }

        /* Wall Clock */
        .wall-clock { position: absolute; top: 70px; left: 200px; width: 60px; height: 60px; border-radius: 50%; background: #ecf0f1; border: 6px solid #2c3e50; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 2; }
        .wall-clock::before { content: ''; position: absolute; top: 28px; left: 28px; width: 2px; height: 20px; background: #e74c3c; transform-origin: top; transform: rotate(180deg); } /* Hour hand */
        .wall-clock::after { content: ''; position: absolute; top: 28px; left: 28px; width: 2px; height: 25px; background: #333; transform-origin: top; transform: rotate(45deg); } /* Minute hand */

        /* Fire Extinguisher */
        .fire-extinguisher { position: absolute; bottom: 28%; left: 30px; width: 25px; height: 70px; background: #e74c3c; border-radius: 12px 12px 4px 4px; box-shadow: 5px 5px 15px rgba(0,0,0,0.6); z-index: 3; }
        .fire-extinguisher::before { content: ''; position: absolute; top: -10px; left: 8px; width: 9px; height: 10px; background: #7f8c8d; border-radius: 2px; }
        .fire-extinguisher::after { content: ''; position: absolute; top: -5px; left: 17px; width: 15px; height: 4px; background: #111; transform: rotate(20deg); } /* Nozzle */

        /* Potted Plant (Greenery) */
        .plant-pot { position: absolute; bottom: 25%; right: 40px; width: 60px; height: 50px; background: #7f8c8d; border-top: 5px solid #95a5a6; border-radius: 5px 5px 15px 15px; box-shadow: 10px 15px 20px rgba(0,0,0,0.6); z-index: 3; }
        .leaf { position: absolute; background: #27ae60; border-radius: 50% 0 50% 0; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3); }
        .leaf1 { bottom: 40px; left: -10px; width: 40px; height: 50px; transform: rotate(-30deg); }
        .leaf2 { bottom: 50px; left: 10px; width: 50px; height: 60px; transform: rotate(10deg); background: #2ecc71; }
        .leaf3 { bottom: 35px; left: 35px; width: 40px; height: 45px; transform: rotate(45deg); }

        /* Heavy Workbench & Desk Clutter */
        .workbench { position: absolute; bottom: 18%; left: 380px; width: 700px; height: 30px; background: linear-gradient(to bottom, #5e4a3d, #3e3027); border-radius: 4px; box-shadow: 0 20px 30px rgba(0,0,0,0.8); z-index: 4; }
        .leg { position: absolute; top: 30px; width: 25px; height: 120px; background: #2c3e50; border-left: 5px solid #1a252f; }
        .leg1 { left: 40px; } .leg2 { left: 330px; } .leg3 { right: 40px; }
        .bin { position: absolute; top: 40px; left: 120px; width: 100px; height: 80px; background: #34495e; border-top: 10px solid #2c3e50; }
        
        /* Laptop & Coffee Mug */
        .laptop { position: absolute; bottom: calc(18% + 30px); left: 630px; width: 60px; height: 40px; background: #bdc3c7; border-radius: 3px 3px 0 0; z-index: 5; border: 2px solid #7f8c8d; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; }
        .laptop::before { content: '</>'; font-size: 14px; color: var(--neon); font-weight: bold; } /* Screen code */
        .laptop::after { content: ''; position: absolute; bottom: -6px; left: -10px; width: 80px; height: 4px; background: #95a5a6; border-radius: 0 0 4px 4px; } /* Keyboard base */
        
        .coffee-mug { position: absolute; bottom: calc(18% + 30px); left: 600px; width: 15px; height: 20px; background: #e74c3c; border-radius: 2px; z-index: 5; border-top: 2px solid #333; }
        .coffee-mug::after { content: ''; position: absolute; top: 3px; right: -6px; width: 8px; height: 10px; border: 3px solid #e74c3c; border-left: none; border-radius: 0 5px 5px 0; }

        /* === 4. Machines & Interactions === */
        .machine-hitbox { position: absolute; z-index: 10; cursor: pointer; transition: all 0.2s; }
        .machine-hitbox:hover { filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,255,0.2)); transform: translateY(-3px); }

        /* --- Left: Floor-standing CNC --- */
        .cnc-container { bottom: 20%; left: 100px; width: 220px; height: 320px; }
        .cnc-base { position: absolute; bottom: 0; width: 100%; height: 80px; background: #1a252f; border-radius: 5px 5px 0 0; }
        .cnc-body { position: absolute; bottom: 80px; width: 100%; height: 240px; background: var(--cnc); border-radius: 10px 10px 0 0; border: 2px solid #111; }
        .cnc-door { position: absolute; top: 30px; left: 20px; width: 180px; height: 140px; background: rgba(52, 152, 219, 0.1); border: 4px solid #7f8c8d; border-radius: 4px; overflow: hidden; }
        .cnc-spindle { position: absolute; top: 0; left: 80px; width: 20px; height: 60px; background: #95a5a6; animation: cncCut 3s infinite; }
        .cnc-bit { position: absolute; bottom: -15px; left: 5px; width: 10px; height: 15px; background: #f1c40f; animation: spin 0.1s infinite; }
        .cnc-screen { position: absolute; top: 185px; right: 20px; width: 50px; height: 30px; background: #000; border: 2px solid #555; display: flex; align-items: center; justify-content: center; }
        .cnc-screen::after { content: 'RUN'; color: #2ecc71; font-size: 10px; animation: blink 1s infinite; }
        .exhaust { position: absolute; top: -100px; left: 80px; width: 40px; height: 100px; background: #34495e; border-left: 10px solid #2c3e50; }

        /* --- Center: 3D Printer on Workbench (Solid Enclosure) --- */
        .printer-container { bottom: calc(18% + 30px); left: 420px; width: 180px; height: 220px; }
        .printer-frame { position: absolute; bottom: 0; width: 100%; height: 100%; border: 12px solid var(--printer-color); border-bottom-width: 25px; border-radius: 8px; box-sizing: border-box; background-color: #1a252f; box-shadow: inset 0 15px 25px rgba(0,0,0,0.8); }
        .printer-bed { position: absolute; bottom: 15px; left: 10px; width: 136px; height: 8px; background: #2c3e50; }
        .printer-model { position: absolute; bottom: 23px; left: 50px; width: 40px; height: 35px; background: var(--glow); opacity: 0.8; }
        .printer-axis { position: absolute; top: 80px; left: 0; width: 100%; height: 8px; background: #bdc3c7; animation: printZ 8s infinite alternate; }
        .printer-head { position: absolute; top: -6px; left: 20px; width: 20px; height: 25px; background: #e74c3c; animation: printX 2s infinite alternate ease-in-out; }
        .spool { position: absolute; top: -45px; left: 60px; width: 40px; height: 40px; background: #e67e22; border-radius: 50%; border: 6px solid #fff; }
        .printer-enclosure { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 12px solid #7f8c8d; border-bottom-width: 20px; box-sizing: border-box; z-index: 10; pointer-events: none; background: rgba(255, 255, 255, 0.03); }

        /* --- Right: Laser Cutter on Workbench --- */
        .laser-container { bottom: calc(18% + 30px); left: 740px; width: 260px; height: 160px; }
        .laser-body { position: absolute; bottom: 0; width: 100%; height: 100%; background: linear-gradient(to right, var(--laser), #5b2c6f); border: 2px solid #111; border-radius: 8px; }
        .laser-glass { position: absolute; top: 15px; left: 15px; width: 230px; height: 80px; background: rgba(0,0,0,0.5); border: 2px solid #333; overflow: hidden; }
        .laser-grid { position: absolute; top: 30px; left: 0; width: 100%; height: 50px; background: repeating-linear-gradient(0deg, #111, #111 2px, transparent 2px, transparent 6px); }
        .laser-arm { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #95a5a6; animation: laserY 3s infinite alternate; }
        .laser-head { position: absolute; top: 0; left: 40px; width: 12px; height: 20px; background: #e67e22; animation: laserX 1.5s infinite alternate; }
        .laser-beam { position: absolute; top: 20px; left: 5px; width: 2px; height: 60px; background: var(--neon); box-shadow: 0 0 10px var(--neon); }

        /* === 5. Tooltip & Link Menu Modal === */
        #status-bar { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; color: #888; pointer-events: none; z-index: 20; }
        .shop-menu { position: absolute; background: rgba(15, 20, 25, 0.95); border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); z-index: 50; display: none; flex-direction: column; gap: 10px; transform: translate(-50%, -100%); backdrop-filter: blur(5px); }
        .shop-menu::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: rgba(15,20,25,0.95) transparent transparent transparent; }
        .shop-menu h3 { margin: 0 0 10px 0; font-size: 14px; color: #aaa; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .shop-btn { background: #222; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 13px; text-align: center; border: 1px solid #444; transition: all 0.2s; white-space: nowrap; }
        .shop-btn:hover { background: #333; color: var(--neon); border-color: var(--neon); }

        /* Animations */
        @keyframes cncCut { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(40px, 30px); } 50% { transform: translate(-30px, 30px); } }
        @keyframes printX { 0% { transform: translateX(0); } 100% { transform: translateX(110px); } }
        @keyframes printZ { 0% { transform: translateY(0); } 100% { transform: translateY(-50px); } }
        @keyframes laserX { 0% { transform: translateX(10px); } 100% { transform: translateX(200px); } }
        @keyframes laserY { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }
        @keyframes spin { 100% { transform: rotateY(360deg); } }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="studio" id="studio-area">
        <div class="ceiling-light"></div>
        <div class="ui-header">
            <h1>Maker Studio</h1>
            <p>Click on an active machine to view available service providers.</p>
        </div>

        <div class="floor"></div>
        <div class="safety-tape"></div> <div class="wall-clock"></div> <div class="fire-extinguisher"></div> <div class="power-box"></div>
        <div class="cable cable-cnc"></div>
        <div class="cable cable-table"></div>

        <div class="pegboard">
            <div class="tool wrench"></div>
            <div class="tool hammer"></div>
            <div class="tool gear"></div>
            <div class="tool saw"></div>
            <div class="tool screwdriver"></div> <div class="tool pliers"></div>      </div>

        <div class="blueprint"></div>
        <div class="shelf">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div> </div>

        <div class="plant-pot">
            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>
        </div>

        <div class="workbench">
            <div class="leg leg1"></div>
            <div class="leg leg2"></div>
            <div class="leg leg3"></div>
            <div class="bin"></div>
        </div>
        <div class="laptop"></div>     <div class="coffee-mug"></div> <div class="machine-hitbox cnc-container" data-type="cnc">
            <div class="exhaust"></div>
            <div class="cnc-base"></div>
            <div class="cnc-body">
                <div class="cnc-door">
                    <div class="cnc-spindle"><div class="cnc-bit"></div></div>
                </div>
                <div class="cnc-screen"></div>
            </div>
        </div>

        <div class="machine-hitbox printer-container" data-type="printer">
            <div class="spool"></div>
            <div class="printer-frame">
                <div class="printer-bed"><div class="printer-model"></div></div>
                <div class="printer-axis"><div class="printer-head"></div></div>
                <div class="printer-enclosure"></div>
            </div>
        </div>

        <div class="machine-hitbox laser-container" data-type="laser">
            <div class="laser-body">
                <div class="laser-glass">
                    <div class="laser-grid"></div>
                    <div class="laser-arm">
                        <div class="laser-head"><div class="laser-beam"></div></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="shop-menu" id="popup-menu">
            <h3 id="menu-title">Select Provider</h3>
            <div id="menu-links" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <div id="status-bar">Hover over equipment...</div>

    <script>
        const machineData = {
            cnc: {
                title: "⚙️ CNC Machining Services",
                shops: [
                    { name: "Titanium Precision Co.", url: "https://s.taobao.com/search?q=CNC%E5%8A%A0%E5%B7%A5" },
                    { name: "Rapid Metalworks CNC", url: "https://s.taobao.com/search?q=CNC%E5%8A%A0%E5%B7%A5" },
                    { name: "Alloy Masters Ltd.", url: "https://s.taobao.com/search?q=CNC%E5%8A%A0%E5%B7%A5" }
                ]
            },
            printer: {
                title: "🔥 3D Printing Hubs",
                shops: [
                    { name: "Polymer 3D Services", url: "https://s.taobao.com/search?q=3D%E6%89%93%E5%8D%B0%E4%BB%A3%E5%B7%A5" },
                    { name: "Resin Print Pro", url: "https://s.taobao.com/search?q=3D%E6%89%93%E5%8D%B0%E4%BB%A3%E5%B7%A5" },
                    { name: "QuickPrint Rapid Prototyping", url: "https://s.taobao.com/search?q=3D%E6%89%93%E5%8D%B0%E4%BB%A3%E5%B7%A5" }
                ]
            },
            laser: {
                title: "⚡ Laser Cutting Experts",
                shops: [
                    { name: "Acrylic Cutters Inc.", url: "https://s.taobao.com/search?q=%E6%BF%80%E5%85%89%E5%88%87%E5%89%B2%E4%BB%A3%E5%B7%A5" },
                    { name: "Precision Laser Engraving", url: "https://s.taobao.com/search?q=%E6%BF%80%E5%85%89%E5%88%87%E5%89%B2%E4%BB%A3%E5%B7%A5" },
                    { name: "Custom Wood Lasers", url: "https://s.taobao.com/search?q=%E6%BF%80%E5%85%89%E5%88%87%E5%89%B2%E4%BB%A3%E5%B7%A5" }
                ]
            }
        };

        const machines = document.querySelectorAll('.machine-hitbox');
        const popupMenu = document.getElementById('popup-menu');
        const menuTitle = document.getElementById('menu-title');
        const menuLinks = document.getElementById('menu-links');
        const statusBar = document.getElementById('status-bar');

        machines.forEach(machine => {
            machine.addEventListener('mouseenter', () => {
                const type = machine.getAttribute('data-type');
                statusBar.textContent = `Status: Active | ${machineData[type].title} ready for configuration.`;
            });
            machine.addEventListener('mouseleave', () => {
                statusBar.textContent = "Hover over equipment...";
            });

            machine.addEventListener('click', (e) => {
                e.stopPropagation(); 
                const type = machine.getAttribute('data-type');
                const data = machineData[type];

                menuTitle.textContent = data.title;
                menuLinks.innerHTML = '';
                data.shops.forEach(shop => {
                    const a = document.createElement('a');
                    a.href = shop.url;
                    a.target = "_blank";
                    a.className = "shop-btn";
                    a.textContent = shop.name;
                    menuLinks.appendChild(a);
                });

                const rect = machine.getBoundingClientRect();
                const studioRect = document.getElementById('studio-area').getBoundingClientRect();
                
                const x = rect.left - studioRect.left + (rect.width / 2);
                const y = rect.top - studioRect.top - 15;

                popupMenu.style.left = `${x}px`;
                popupMenu.style.top = `${y}px`;
                popupMenu.style.display = 'flex';
            });
        });

        document.addEventListener('click', () => {
            popupMenu.style.display = 'none';
        });

        popupMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
